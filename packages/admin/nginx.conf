server {
 listen 80;
 server_name _;
 root /usr/share/nginx/html;
 add_header X-Content-Type-Options nosniff;
 add_header Referrer-Policy no-referrer;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://telegram.org; style-src 'self' 'unsafe-inline'; img-src 'self' https: http://localhost:9000 http://127.0.0.1:9000 data:; connect-src 'self'; frame-ancestors https://web.telegram.org https://*.telegram.org;" always;
 location /api/ { proxy_pass http://backend:3000/; client_max_body_size 12m; }
 location / { try_files $uri $uri/ /index.html; }
}
