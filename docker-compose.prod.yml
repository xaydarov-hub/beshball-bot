services:
  backend:
    environment:
      NODE_ENV: production
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile:ro", "caddy_data:/data", "caddy_config:/config"]
    depends_on: [admin, backend, minio]
volumes:
  caddy_data:
  caddy_config:
