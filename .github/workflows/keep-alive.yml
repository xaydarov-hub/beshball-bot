name: Keep-alive ping
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /ready to prevent Render free-plan sleep
        run: |
          curl --fail --silent --show-error --max-time 90 --retry 2 --retry-delay 5 \
            https://beshball.onrender.com/ready
