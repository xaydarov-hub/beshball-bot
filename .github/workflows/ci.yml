name: Checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.11-alpine
        env:
          POSTGRES_USER: beshball
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: beshball_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U beshball" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://beshball:ci-test-only@localhost:5432/beshball_test
      DATABASE_URL: postgresql://beshball:ci-test-only@localhost:5432/beshball_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:legacy
      - run: npm run test:integration
      - run: npm run build
      - run: npm audit --audit-level=high
